<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="达人矩阵 Mockup">
  <defs>
    <linearGradient id="paper" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaf8"/>
      <stop offset="50%" stop-color="#f6d7cf"/>
      <stop offset="100%" stop-color="#e0e6eb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#2d2625"/>
      <stop offset="100%" stop-color="#594743"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#d7dce3"/>
      <stop offset="72%" stop-color="#a8b0bc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#3b2d2b" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <path d="M0 632 C230 520 340 742 558 594 C756 460 910 586 1200 430 L1200 800 L0 800 Z" fill="#fff" opacity=".48"/>
  
  <g font-family="'PingFang SC', sans-serif">
    <text x="82" y="98" font-size="34" font-weight="700" fill="#2d2625">达人矩阵：从高质感背书到真实使用扩散</text>
    <text x="82" y="146" font-size="22" fill="#6f6360">不同层级不要说同一句话，按任务拆内容。</text>
  </g>
  <g filter="url(#shadow)" font-family="'PingFang SC', sans-serif">
    <path d="M600 184 L1010 650 H190 Z" fill="#fffefd" stroke="#2d2625" stroke-width="4"/>
    <path d="M430 376 H770" stroke="#d8cbc7" stroke-width="3"/>
    <path d="M330 494 H870" stroke="#d8cbc7" stroke-width="3"/>
    <text x="600" y="294" text-anchor="middle" font-size="28" font-weight="700" fill="#2d2625">头部风格达人</text>
    <text x="600" y="334" text-anchor="middle" font-size="19" fill="#6f6360">高质感 KV / 生活方式背书</text>
    <text x="600" y="446" text-anchor="middle" font-size="28" font-weight="700" fill="#2d2625">垂类护发 &amp; 香氛达人</text>
    <text x="600" y="486" text-anchor="middle" font-size="19" fill="#6f6360">功效解释 / 试香体验 / 套组推荐</text>
    <text x="600" y="588" text-anchor="middle" font-size="28" font-weight="700" fill="#2d2625">KOC 与真实用户</text>
    <text x="600" y="628" text-anchor="middle" font-size="19" fill="#6f6360">发质痛点、门店打卡、礼盒开箱扩散</text>
  </g>
</svg>