<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="礼盒开箱 Mockup">
  <defs>
    <linearGradient id="paper" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fffaf8"/>
      <stop offset="50%" stop-color="#f6d7cf"/>
      <stop offset="100%" stop-color="#e0e6eb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#2d2625"/>
      <stop offset="100%" stop-color="#594743"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#d7dce3"/>
      <stop offset="72%" stop-color="#a8b0bc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#3b2d2b" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <path d="M0 632 C230 520 340 742 558 594 C756 460 910 586 1200 430 L1200 800 L0 800 Z" fill="#fff" opacity=".48"/>
  
  <g font-family="'PingFang SC', sans-serif">
    <text x="74" y="94" font-size="34" font-weight="700" fill="#2d2625">Bestie Gifting：开箱内容 Demo</text>
    <text x="74" y="142" font-size="22" fill="#6f6360">把产品组合、GWP 和拍照动作一起设计，礼盒才会成为传播资产。</text>
  </g>
  
    <g filter="url(#shadow)" transform="translate(96 214)">
      <rect width="300" height="410" fill="#fffefd" stroke="#d8cbc7"/>
      <circle cx="150" cy="142" r="96" fill="url(#metal)"/>
      <image href="product-parfum.png" x="96" y="94" width="108" height="108"/>
      
      
      <text x="150" y="292" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#2d2625">互喷发香</text>
      <text x="150" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#6f6360">两人同行同款香气</text>
    </g>
    <g filter="url(#shadow)" transform="translate(456 214)">
      <rect width="300" height="410" fill="#fffefd" stroke="#d8cbc7"/>
      <circle cx="150" cy="142" r="96" fill="url(#metal)"/>
      
      <image href="product-mask.png" x="70" y="104" width="160" height="160"/>
      
      <text x="150" y="292" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#2d2625">奶皮深护</text>
      <text x="150" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#6f6360">周末一起做护理</text>
    </g>
    <g filter="url(#shadow)" transform="translate(816 214)">
      <rect width="300" height="410" fill="#fffefd" stroke="#d8cbc7"/>
      <circle cx="150" cy="142" r="96" fill="url(#metal)"/>
      
      
      <image href="product-oil-packshot.png" x="84" y="78" width="150" height="150"/>
      <text x="150" y="292" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#2d2625">补光合照</text>
      <text x="150" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" fill="#6f6360">出门前同闪耀</text>
    </g>
